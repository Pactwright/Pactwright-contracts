# Shared budget configuration for the Tollcraft cost tooling.
#
# Consumed by BOTH tools:
#   * `cargo budget-report` (soroban-budget-assert, network simulation)
#   * `cargo cost-lint`     (soroban-cost-linter, static analysis)
#
# Baselines: first `cargo budget-report` run on testnet, rounded up, x 1.15 tolerance,
# committed deliberately (ROADMAP C-12). Re-baseline on protocol upgrades (XC-04).
#
# Per-transaction network ceilings:
#   CPU 100,000,000 · memory 40,000,000 · read 200,000 B · write 66,000 B
#   40 entry reads · 25 entry writes

network = "testnet"
source = "pactwright-deployer"   # stellar CLI identity (F-11)

# -- Tier A (local, WASM mode) ------------------------------------------------
# Enforced by contracts/pact/src/test/budget.rs (#[budget_lt]); numbers and the WASM hash
# they were measured on are in docs/BENCHMARKS.md. Limits = measured x 1.15, rounded up:
#   open            cpu 1_030_000  mem 1_660_000
#   record_verdict  cpu 1_300_000  mem 1_570_000
#   settle          cpu 1_240_000  mem 1_700_000
#   release         cpu 1_010_000  mem 1_640_000
#   close_meter     cpu 1_800_000  mem 1_710_000
#
# -- Tier B (testnet, cargo budget-report) -----------------------------------
# Not configured yet: pact entrypoints need state (a funded escrow, signed attestations), which
# `cargo budget-report`'s single-call simulation cannot set up. Tracked as ROADMAP C-21.
