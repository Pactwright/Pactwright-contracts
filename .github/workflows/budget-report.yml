name: budget-report
on:
  push:
    branches: [main]

jobs:
  budget-report:
    # Tier B (testnet) baselines need a scripted stateful flow: enabled in ROADMAP C-21.
    # Tier A budgets run in ci.yml (test::budget).
    if: false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cargo budget-report --check
