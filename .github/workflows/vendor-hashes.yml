name: vendor-hashes
on:
  pull_request:
    paths: ["vendor/wasm/**", "scripts/check_vendor_hashes.sh"]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - run: scripts/check_vendor_hashes.sh
