name: vendor-hashes
on:
  pull_request:
    paths: ["vendor/wasm/**", "scripts/check_vendor_hashes.sh"]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: scripts/check_vendor_hashes.sh
