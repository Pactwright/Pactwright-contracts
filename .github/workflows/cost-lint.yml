name: cost-lint
on:
  pull_request:

jobs:
  cost-lint:
    runs-on: ubuntu-latest
    env:
      # The Action builds its lint library from this repo's root, where
      # rust-toolchain.toml would select stable (no rustc-dev). Force the
      # Action's nightly for every step; RUSTUP_TOOLCHAIN overrides the file.
      # Keep in sync with the Action's `toolchain` input default.
      RUSTUP_TOOLCHAIN: nightly-2026-04-16
    steps:
      - uses: actions/checkout@v4
      # Pinned to the Tollcraft main commit that passed on PR #3 (2026-10-28). The only
      # release, v0.1.0, predates fixes this workflow relies on. Bump deliberately.
      - uses: Tollcraft/soroban-cost-linter@c4a98e1b7d893b2538b68be8c10f7aa4cd499082
        with:
          config: budget.toml
          toolchain: nightly-2026-04-16
