[package]
name = "pactwright-pact"
description = "Pactwright escrow contract: verdict-gated settlement, signed-usage metering, deadlines"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
crate-type = ["cdylib", "rlib"]
doctest = false

[dependencies]
soroban-sdk = { workspace = true }

[dev-dependencies]
soroban-sdk = { workspace = true, features = ["testutils"] }
pactwright-testutils = { path = "../testutils" }
ed25519-dalek = "3.0.0"
stellar-strkey = "0.0.16"
bolero = "0.13"
# Tollcraft soroban-budget-assert Tier A macros (not on crates.io; pinned commit).
budget-macros = { git = "https://github.com/Tollcraft/soroban-budget-assert", rev = "b2114411950455e85fbb07b7168fe4aa1a2a2ffe" }
# soroban-budget-assert macros (#[budget_cpu_lt] ...) are added in ROADMAP C-12.
